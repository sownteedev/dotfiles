[package]
name = "sownteeshell-calendar-daemon"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1.0"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock", "serde"] }
icalendar = { version = "0.17.13", features = ["chrono-tz", "parser"] }
quick-xml = "0.42.0"
reqwest = { version = "0.13.4", default-features = false, features = ["form", "json", "query", "rustls"] }
rusqlite = { version = "0.40.2", features = ["bundled"] }
secret-service = { version = "5.2.0", default-features = false, features = ["rt-tokio-crypto-rust"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.11"
thiserror = "2.0"
tokio = { version = "1.47", features = ["io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
url = "2.5"
uuid = { version = "1.18", features = ["v4"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
